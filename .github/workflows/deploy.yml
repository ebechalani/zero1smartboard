name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A new avr-toolchain-wasm-v* release: once its workflow has built the compiler and attached
  # it to the release, redeploy so that "Upload to board" appears without a manual run.
  workflow_run:
    workflows: [avr-toolchain-wasm]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Only this workflow uses the "pages" group: a pull request run (ci.yml) can never cancel a deploy.
# A toolchain run that does not deploy (a pull request run, a failed run) gets a group of its
# own, so that it cannot cancel a deploy in progress either.
concurrency:
  group: ${{ (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) && 'pages' || format('pages-skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04 # its gcc-avr is 7.3.0, the GCC of cc1plus.wasm; a newer Ubuntu ships another
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # "Upload to board" (docs/UPLOAD.md): the Arduino core + libraries are precompiled with the
      # native avr-gcc at build time, the WebAssembly compiler comes from the avr-toolchain-wasm-v*
      # release of this repository. Both are cached; if the release does not exist yet the build
      # still succeeds and the site simply hides the Upload button.
      - name: Install avr-gcc (for the toolchain bundle)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-avr avr-libc binutils-avr
      - name: Cache the toolchain (wasm tools + bundle)
        uses: actions/cache@v4
        with:
          path: |
            public/toolchain
            node_modules/.cache/zero1-toolchain
            node_modules/.cache/zero1-arduino-sources
          key: toolchain-${{ hashFiles('tools/build-toolchain-bundle.mjs', 'tools/fetch-toolchain.mjs', 'tools/arduino-libs/**', 'public/THIRD_PARTY_NOTICES.md') }}-${{ github.run_id }}
          restore-keys: |
            toolchain-${{ hashFiles('tools/build-toolchain-bundle.mjs', 'tools/fetch-toolchain.mjs', 'tools/arduino-libs/**', 'public/THIRD_PARTY_NOTICES.md') }}-
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }} # finds the toolchain release without hitting the anonymous API rate limit
      - name: Emulated hardware tests (Optiboot upload, LCD / ultrasonic libraries, Python on the chip)
        run: npm run test:hardware-sim
        env:
          # Python on the chip (docs/PYTHON.md §10.6): with the release's WebAssembly tools, else apt's avr-g++; never skipped
          ZERO1_REQUIRE_TOOLCHAIN: '1'
      - name: Toolchain status
        run: |
          if [ -f public/toolchain/manifest.json ]; then
            echo "Upload feature ON: $(node -p "require('./public/toolchain/manifest.json').release")"
            test -f dist/toolchain/tools/cc1plus.wasm
          else
            echo "::warning::No usable avr-toolchain-wasm release (none yet, or its files are not attached): the site is deployed WITHOUT the Upload feature"
            # started by a toolchain release: deploying without its compiler would hide the failure
            if [ "${{ github.event_name }}" = workflow_run ]; then exit 1; fi
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Security rules and data-layer integration tests against the Firebase emulators
  # (docs/CLASSROOM.md §7.1-7.2, §7.6). firebase-tools is fetched with npx, not installed.
  emulator-tests:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.31.0
      - name: Cache the npx download of firebase-tools
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-firebase-tools-15.31.0
      - run: npm ci
      - run: npm run test:emulator
      - name: Rules mutation check (docs/CLASSROOM.md §7.1)
        run: npx --yes firebase-tools@15.31.0 emulators:exec --only firestore --project demo-zero1 "sh tests-emulator/mutations.sh"

  deploy:
    needs: [build, emulator-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
