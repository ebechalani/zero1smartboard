name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only this workflow uses the "pages" group: a pull request run (ci.yml) can never cancel a deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # "Upload to board" (docs/UPLOAD.md): the Arduino core + libraries are precompiled with the
      # native avr-gcc at build time, the WebAssembly compiler comes from the avr-toolchain-wasm-v*
      # release of this repository. Both are cached; if the release does not exist yet the build
      # still succeeds and the site simply hides the Upload button.
      - name: Install avr-gcc (for the toolchain bundle)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-avr avr-libc binutils-avr
      - name: Cache the toolchain (wasm tools + bundle)
        uses: actions/cache@v4
        with:
          path: |
            public/toolchain
            node_modules/.cache/zero1-toolchain
            node_modules/.cache/zero1-arduino-sources
          key: toolchain-${{ hashFiles('tools/build-toolchain-bundle.mjs', 'tools/fetch-toolchain.mjs', 'tools/arduino-libs/**', 'public/THIRD_PARTY_NOTICES.md') }}-${{ github.run_id }}
          restore-keys: |
            toolchain-${{ hashFiles('tools/build-toolchain-bundle.mjs', 'tools/fetch-toolchain.mjs', 'tools/arduino-libs/**', 'public/THIRD_PARTY_NOTICES.md') }}-
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }} # finds the toolchain release without hitting the anonymous API rate limit
      - name: Emulated hardware tests (Optiboot upload, LCD / ultrasonic libraries)
        run: npm run test:hardware-sim
      - name: Toolchain status
        run: |
          if [ -f public/toolchain/manifest.json ]; then
            echo "Upload feature ON: $(node -p "require('./public/toolchain/manifest.json').release")"
            test -f dist/toolchain/tools/cc1plus.wasm
          else
            echo "::warning::No avr-toolchain-wasm release found: the site is deployed WITHOUT the Upload feature"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Security rules and data-layer integration tests against the Firebase emulators
  # (docs/CLASSROOM.md §7.1-7.2, §7.6). firebase-tools is fetched with npx, not installed.
  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.31.0
      - name: Cache the npx download of firebase-tools
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-firebase-tools-15.31.0
      - run: npm ci
      - run: npm run test:emulator

  deploy:
    needs: [build, emulator-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
